apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-history-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: helm-history-report
    app.kubernetes.io/component: collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: helm-history-uploader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: helm-history-report
    app.kubernetes.io/component: uploader
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.uploaderRoleArn | quote }}
