apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-history-report
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-history-report
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: helm-history-collector
    namespace: {{ .Release.Namespace }}
  - kind: ServiceAccount
    name: helm-history-uploader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-history-report
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: helm-history-reader
  namespace: {{ .Values.history.targetNamespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helm-history-reader
  namespace: {{ .Values.history.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: helm-history-collector
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helm-history-reader
