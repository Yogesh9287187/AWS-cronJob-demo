apiVersion: batch/v1
kind: CronJob
metadata:
  name: helm-history-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: helm-history-report
    app.kubernetes.io/component: collector
spec:
  schedule: {{ .Values.history.schedule | quote }}
  timeZone: {{ .Values.history.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: helm-history-report
            app.kubernetes.io/component: collector
        spec:
          serviceAccountName: helm-history-collector
          restartPolicy: OnFailure
          containers:
            - name: collect
              image: {{ .Values.tools.image | quote }}
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash", "-ec"]
              args:
                - |
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl tar
                  curl -fsSLo /tmp/helm.tar.gz "https://get.helm.sh/helm-{{ .Values.tools.helmVersion }}-linux-amd64.tar.gz"
                  tar -xzf /tmp/helm.tar.gz -C /tmp
                  install /tmp/linux-amd64/helm /usr/local/bin/helm
                  curl -fsSLo /usr/local/bin/kubectl "https://dl.k8s.io/release/{{ .Values.tools.kubectlVersion }}/bin/linux/amd64/kubectl"
                  chmod +x /usr/local/bin/kubectl
                  SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
                  export KUBECONFIG=/tmp/kubeconfig
                  kubectl config set-cluster in-cluster --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}" --certificate-authority="${SA_DIR}/ca.crt"
                  kubectl config set-credentials in-cluster --token="$(cat "${SA_DIR}/token")"
                  kubectl config set-context in-cluster --cluster=in-cluster --user=in-cluster --namespace="$REPORT_NAMESPACE"
                  kubectl config use-context in-cluster
                  exec pwsh -NoLogo -NoProfile -File /scripts/collect.ps1
              env:
                - name: HELM_RELEASE
                  value: {{ .Values.history.releaseName | quote }}
                - name: TARGET_NAMESPACE
                  value: {{ .Values.history.targetNamespace | quote }}
                - name: REPORT_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                - name: UPLOAD_CRONJOB
                  value: helm-history-uploader
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: scripts
              configMap:
                name: helm-history-report-scripts
